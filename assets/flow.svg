<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 270" width="1050" height="270" role="img" aria-label="Flow: claim, resolve the version, check evidence, then verify the contract and implement, or stop at NOT VERIFIED">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1049" height="269" rx="14" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">
    <rect x="24" y="64" width="110" height="52" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="79" y="95" fill="#E2E8F0">Claim</text>

    <rect x="155" y="64" width="160" height="52" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="235" y="95" fill="#E2E8F0">Gate 1 · resolve</text>

    <path d="M 415 42 L 490 90 L 415 138 L 340 90 Z" fill="#0F1A2E" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="415" y="94" fill="#93C5FD">Evidence?</text>

    <rect x="530" y="64" width="160" height="52" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="610" y="95" fill="#E2E8F0">Gate 3 · contract</text>

    <rect x="715" y="64" width="160" height="52" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="795" y="95" fill="#E2E8F0">Gate 4 · implement</text>

    <rect x="900" y="64" width="125" height="52" rx="8" fill="#111C2E" stroke="#334155" stroke-width="1"/>
    <text x="962" y="95" fill="#E2E8F0">Gate 5 · audit</text>

    <rect x="340" y="176" width="150" height="52" rx="8" fill="#1A1015" stroke="#7F1D1D" stroke-width="1.5"/>
    <text x="415" y="207" fill="#FCA5A5">NOT VERIFIED</text>
  </g>

  <g stroke="#64748B" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 134 90 L 150 90"/>
    <path d="M 315 90 L 335 90"/>
    <path d="M 490 90 L 525 90"/>
    <path d="M 690 90 L 710 90"/>
    <path d="M 875 90 L 895 90"/>
    <path d="M 415 138 L 415 171"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748B">
    <text x="508" y="82">yes</text>
    <text x="428" y="160">no</text>
  </g>

  <text x="24" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11" fill="#475569">No evidence for this version means no implementation. The gate is not advisory.</text>
</svg>
